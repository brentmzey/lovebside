# Enhanced Observability Stack (Lite Version)
# Ready to run locally - just adds log aggregation and system metrics
# 
# Usage: docker-compose -f docker-compose.enhanced-lite.yml up -d

version: '3.9'

services:
  # Existing services from docker-compose.yml
  redis:
    image: redis:7-alpine
    container_name: bside-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bside-network

  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: bside-pocketbase:local
    container_name: bside-pocketbase
    restart: unless-stopped
    ports:
      - "8092:8090"
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb_hooks:ro
    environment:
      - ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-tester_admin@bside.love}
      - ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-password123}
      - PB_PUBLIC_URL=${PB_PUBLIC_URL:-http://localhost:8090}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bside-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    image: bside-server:local
    container_name: bside-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - REDIS_URL=redis://redis:6379
      - SERVER_PORT=8080
      - ENVIRONMENT=development
    depends_on:
      pocketbase:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    networks:
      - bside-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: bside-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - server
      - pocketbase
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bside-network

  # Enhanced Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: bside-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - bside-network

  loki:
    image: grafana/loki:2.9.3
    container_name: bside-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - bside-network

  promtail:
    image: grafana/promtail:2.9.3
    container_name: bside-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-logs:/var/log/nginx:ro
      - ./logs:/app/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - bside-network
    environment:
      - HOSTNAME={{.Node.Hostname}}

  grafana:
    image: grafana/grafana:latest
    container_name: bside-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - bside-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: bside-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - bside-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: bside-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - bside-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: bside-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - bside-network

  goaccess:
    image: allinurl/goaccess
    container_name: bside-goaccess
    restart: unless-stopped
    ports:
      - "7817:7817"
    volumes:
      - nginx-logs:/opt/goaccess/logs:ro
    command: 
      - /opt/goaccess/logs/access.log
      - --log-format=%h - %u [%d:%t %^] "%r" %s %b "%R" "%u" "%^" rt=%T uct=%^ uht=%^ urt=%^ gz=%^ vhost=%v
      - --date-format=%d/%b/%Y
      - --time-format=%H:%M:%S
      - --real-time-html
      - --ws-url=ws://localhost:7817
      - --port=7817
    networks:
      - bside-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bside-redis-ui
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - bside-network

networks:
  bside-network:
    driver: bridge

volumes:
  redis-data:
  nginx-logs:
  prometheus-data:
  grafana-data:
