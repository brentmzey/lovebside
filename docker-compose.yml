

services:
  # PocketBase Database
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: bside-pocketbase:local
    container_name: bside-pocketbase
    restart: unless-stopped
    ports:
      - "8092:8090"
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
    environment:
      # Admin credentials (auto-created on first run)
      - ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-tester_admin@bside.love}
      - ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-password123}
      
      # CDN and AWS (for future use)
      - CDN_ENABLED=${CDN_ENABLED:-false}
      - CDN_BASE_URL=${CDN_BASE_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bside-network

  # Ktor Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bside-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - SERVER_PORT=8080
      - ENVIRONMENT=production
      # PocketBase will use these for generating file URLs
      - PB_PUBLIC_URL=${PB_PUBLIC_URL:-http://localhost:8090}
      
      # CDN Configuration
      - CDN_ENABLED=${CDN_ENABLED:-false}
      - CDN_BASE_URL=${CDN_BASE_URL}
      
      # AWS S3 Configuration (for CDN uploads)
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - pocketbase
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bside-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: bside-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - pocketbase
    networks:
      - bside-network

networks:
  bside-network:
    driver: bridge

volumes:
  pocketbase-data:
