

services:
  # Redis (Distributed Locking & Caching)
  redis:
    image: redis:7-alpine
    container_name: bside-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bside-network

  # PocketBase Database
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: bside-pocketbase:local
    container_name: bside-pocketbase
    restart: unless-stopped
    ports:
      - "8092:8090"
    volumes:
      - ./pocketbase/pb_data:/pb_data
    environment:
      # Admin credentials (auto-created on first run)
      - ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-tester_admin@bside.love}
      - ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-password123}
      
      # CDN and AWS (for future use)
      - CDN_ENABLED=${CDN_ENABLED:-false}
      - CDN_BASE_URL=${CDN_BASE_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bside-network

  # Ktor Backend Server
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: bside-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - REDIS_URL=redis://redis:6379
      - SERVER_PORT=8080
      - ENVIRONMENT=production
      # PocketBase will use these for generating file URLs
      - PB_PUBLIC_URL=${PB_PUBLIC_URL:-http://localhost:8090}
      
      # CDN Configuration
      - CDN_ENABLED=${CDN_ENABLED:-false}
      - CDN_BASE_URL=${CDN_BASE_URL}
      
      # AWS S3 Configuration (for CDN uploads)
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - pocketbase
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bside-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bside-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - bside-logs:/var/log/nginx
    depends_on:
      - server
      - pocketbase
    networks:
      - bside-network

  # GoAccess Log Analyzer
  goaccess:
    image: allinurl/goaccess
    container_name: bside-goaccess
    restart: unless-stopped
    ports:
      - "7817:7817"
    volumes:
      - bside-logs:/opt/goaccess/logs:ro
    command: 
      - /opt/goaccess/logs/access.log
      - --log-format=%h - %u [%d:%t %^] "%r" %s %b "%R" "%u" "%^" rt=%T uct=%^ uht=%^ urt=%^ gz=%^ vhost=%v
      - --date-format=%d/%b/%Y
      - --time-format=%H:%M:%S
      - --real-time-html
      - --port=7817
    networks:
      - bside-network

networks:
  bside-network:
    driver: bridge

volumes:
  bside-logs:
  redis-data:
