# OpenTelemetry Collector Configuration - Simplified for stability
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resource:
    attributes:
      - key: service.name
        value: bside-app
        action: insert
      - key: deployment.environment
        value: development
        action: insert

exporters:
  # Use debug instead of deprecated logging
  debug:
    verbosity: detailed

  # Export to Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Export to Zipkin (Jaeger compatible)
  zipkin:
    endpoint: "http://jaeger:9411/api/v2/spans"

  # Export to Prometheus Remote Write
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug, zipkin]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [debug, prometheus, prometheusremotewrite]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - periodic:
            interval: 30000
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
