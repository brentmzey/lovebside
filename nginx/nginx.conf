events {
    worker_connections 2048;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'gz=$gzip_ratio vhost=$host';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream: PocketBase (Auth, CRUD, Real-time)
    upstream pocketbase {
        server pocketbase:8090 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Upstream: Ktor Backend (Business Logic, Jobs)
    upstream ktor_backend {
        server server:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost bside.local;  # Update for production: bside.app www.bside.app
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        
        # Root location for health checks
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ==========================================
        # PocketBase Routes (Direct CRUD, Auth, Real-time)
        # ==========================================
        
        # PocketBase API - CRUD operations, auth, subscriptions
        location /api/pb/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Proxy settings
            proxy_pass http://pocketbase/api/;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # WebSocket support (for Real-time subscriptions)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for real-time connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        
        # PocketBase Admin UI
        location /_/ {
            proxy_pass http://pocketbase/_/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # File uploads to PocketBase (images, videos, documents)
        location /api/pb/files/ {
            # Larger rate limit for uploads
            limit_req zone=upload_limit burst=5 nodelay;
            
            # Increased limits for file uploads
            client_max_body_size 50M;
            client_body_buffer_size 10M;
            
            proxy_pass http://pocketbase/api/files/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for uploads
            proxy_connect_timeout 90s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Show upload progress
            proxy_request_buffering off;
        }

        # ==========================================
        # Ktor Backend Routes (Business Logic, Jobs)
        # ==========================================
        
        # Ktor API - matching algorithms, complex queries, background jobs
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://ktor_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts for backend processing
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ==========================================
        # Frontend / Static Content
        # ==========================================
        
        # Serve the Single Page Application (SPA)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Cache control for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, no-transform";
            }
        }
    }
    
    # HTTPS redirect (for production)
    # Uncomment when SSL is configured
    # server {
    #     listen 80;
    #     server_name bside.app www.bside.app;
    #     return 301 https://$server_name$request_uri;
    # }
    
    # HTTPS server (for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name bside.app www.bside.app;
    #     
    #     ssl_certificate /etc/nginx/ssl/bside.app.crt;
    #     ssl_certificate_key /etc/nginx/ssl/bside.app.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     
    #     # Include all location blocks from above
    # }
}
