events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 30;
    send_timeout 30;
    types_hash_max_size 4096;
    
    # Buffer optimizations
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss
               image/svg+xml;
    
    # Brotli compression (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript 
    #              application/json application/javascript application/xml+rss;
    
    # ============================================
    # RATE LIMITING ZONES
    # ============================================
    
    # General API rate limit (10 req/sec per IP, burst 20)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=10r/s;
    
    # Auth endpoints (stricter: 5 req/sec, burst 10)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    
    # Upload endpoints (2 req/sec, burst 5)
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    
    # WebSocket/SSE connections (100 per IP)
    limit_conn_zone $binary_remote_addr zone=websocket_limit:10m;
    
    # Read-heavy operations (higher throughput: 50 req/sec)
    limit_req_zone $binary_remote_addr zone=read_limit:20m rate=50r/s;
    
    # Write-heavy operations (lower throughput: 5 req/sec)
    limit_req_zone $binary_remote_addr zone=write_limit:10m rate=5r/s;
    
    # ============================================
    # CONNECTION LIMITING
    # ============================================
    
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
    
    # ============================================
    # LOGGING
    # ============================================
    
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time" '
                       'gz=$gzip_ratio vhost=$host upstream=$upstream_addr '
                       'cache=$upstream_cache_status';
    
    access_log /var/log/nginx/access.log detailed buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;
    
    # ============================================
    # UPSTREAM DEFINITIONS
    # ============================================
    
    # PocketBase - Primary data store
    # Using least_conn for better distribution under load
    upstream pocketbase {
        least_conn;
        server pocketbase:8090 max_fails=3 fail_timeout=30s weight=1;
        keepalive 64;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # Ktor Backend - Business logic & compute
    upstream ktor_backend {
        least_conn;
        server server:8080 max_fails=3 fail_timeout=30s weight=1;
        keepalive 64;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # Redis (if needed for direct access)
    # upstream redis {
    #     server redis:6379 max_fails=2 fail_timeout=10s;
    #     keepalive 32;
    # }
    
    # ============================================
    # CACHING
    # ============================================
    
    # Cache for static assets
    proxy_cache_path /var/cache/nginx/static 
                     levels=1:2 
                     keys_zone=static_cache:10m 
                     max_size=100m 
                     inactive=60m 
                     use_temp_path=off;
    
    # Cache for API responses (read-only data)
    proxy_cache_path /var/cache/nginx/api 
                     levels=1:2 
                     keys_zone=api_cache:10m 
                     max_size=50m 
                     inactive=10m 
                     use_temp_path=off;
    
    # ============================================
    # MAIN SERVER
    # ============================================
    
    server {
        listen 80;
        server_name localhost bside.local;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Content-Security-Policy "default-src 'self'" always;
        
        # Health check endpoint
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Nginx status for monitoring
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
        
        # ========================================
        # AUTHENTICATION ROUTES (Auth-heavy)
        # ========================================
        
        location ~ ^/api/pb/(auth|oauth2|users/auth-with-password|users/auth-with-oauth2|users/auth-refresh) {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn addr_limit 10;
            
            proxy_pass http://pocketbase;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # No caching for auth
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        
        # ========================================
        # REAL-TIME / WEBSOCKET ROUTES
        # ========================================
        
        location ~ ^/api/pb/(realtime|subscribe) {
            limit_conn websocket_limit 100;
            
            proxy_pass http://pocketbase;
            proxy_http_version 1.1;
            
            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Long timeouts for persistent connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Buffering settings for real-time
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # ========================================
        # FILE UPLOAD ROUTES (Write-heavy)
        # ========================================
        
        location ~ ^/api/pb/files/ {
            limit_req zone=upload_limit burst=5 nodelay;
            limit_req zone=write_limit burst=10 nodelay;
            
            client_max_body_size 50M;
            client_body_buffer_size 10M;
            
            proxy_pass http://pocketbase;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 90s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            proxy_request_buffering off;
            
            # No caching for uploads
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        
        # ========================================
        # WRITE-HEAVY CRUD OPERATIONS
        # ========================================
        
        location ~ ^/api/pb/collections/.+/records$ {
            # POST/PATCH/DELETE - write operations
            limit_req zone=write_limit burst=10 nodelay;
            
            if ($request_method ~ ^(POST|PATCH|PUT|DELETE)$) {
                set $is_write 1;
            }
            
            proxy_pass http://pocketbase;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # No caching for write operations
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        
        # ========================================
        # READ-HEAVY CRUD OPERATIONS
        # ========================================
        
        location ~ ^/api/pb/collections/.+/records/.+ {
            # GET operations - read-heavy
            limit_req zone=read_limit burst=100 nodelay;
            
            proxy_pass http://pocketbase;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Cache GET requests for profile data
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            
            add_header X-Cache-Status $upstream_cache_status;
        }
        
        # ========================================
        # GENERAL POCKETBASE API
        # ========================================
        
        location /api/pb/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://pocketbase/api/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # PocketBase Admin UI
        location /_/ {
            proxy_pass http://pocketbase/_/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ========================================
        # KTOR BACKEND ROUTES
        # ========================================
        
        # Matching algorithms (compute-heavy, low frequency)
        location ~ ^/api/v1/(matches|matching|algorithms) {
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Longer timeouts for heavy compute
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # General Ktor API
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://ktor_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ========================================
        # FALLBACK
        # ========================================
        
        location / {
            proxy_pass http://ktor_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
