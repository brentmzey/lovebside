events {
    worker_connections 4096;  # Increased from 2048
    use epoll;  # Linux optimization
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ==========================================
    # PERFORMANCE OPTIMIZATIONS
    # ==========================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;  # Reuse connections
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # ==========================================
    # RATE LIMITING ZONES
    # ==========================================
    
    limit_req_zone $binary_remote_addr zone=api_read:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api_write:20m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:20m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=realtime:10m rate=10r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # ==========================================
    # UPSTREAM POOLS
    # ==========================================
    
    # PocketBase Read Pool (Load Balanced)
    upstream pocketbase_read {
        least_conn;  # Route to least busy instance
        
        server pocketbase-1:8090 max_fails=3 fail_timeout=30s weight=1;
        server pocketbase-2:8090 max_fails=3 fail_timeout=30s weight=1;
        server pocketbase-3:8090 max_fails=3 fail_timeout=30s weight=1;
        server pocketbase-4:8090 max_fails=3 fail_timeout=30s weight=1;
        
        keepalive 256;  # Connection pooling
    }
    
    # PocketBase Write Pool (Master)
    upstream pocketbase_write {
        server pocketbase-master:8090 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }
    
    # PocketBase Realtime (Sticky Sessions)
    upstream pocketbase_realtime {
        ip_hash;  # Sticky sessions for SSE
        
        server pocketbase-1:8090 max_fails=2 fail_timeout=20s;
        server pocketbase-2:8090 max_fails=2 fail_timeout=20s;
        server pocketbase-3:8090 max_fails=2 fail_timeout=20s;
        server pocketbase-4:8090 max_fails=2 fail_timeout=20s;
        
        keepalive 512;  # More connections for SSE
    }
    
    # Ktor Backend Pool
    upstream ktor_backend {
        least_conn;
        
        server server-1:8080 max_fails=3 fail_timeout=30s weight=1;
        server server-2:8080 max_fails=3 fail_timeout=30s weight=1;
        
        keepalive 128;
    }
    
    # Redis Queue (for async operations)
    upstream redis_queue {
        server redis-1:6379 max_fails=2 fail_timeout=10s;
        server redis-2:6379 backup;  # Failover
    }
    
    # ==========================================
    # LOGGING
    # ==========================================
    
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time" '
                        'gz=$gzip_ratio upstream=$upstream_addr '
                        'cache=$upstream_cache_status vhost=$host';
    
    access_log /var/log/nginx/access.log detailed buffer=32k flush=10s;
    error_log /var/log/nginx/error.log warn;
    
    # ==========================================
    # CACHING (For CDN-backed content)
    # ==========================================
    
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:100m
                     max_size=1g inactive=60m use_temp_path=off;
    
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m
                     max_size=2g inactive=24h use_temp_path=off;
    
    # ==========================================
    # MAIN SERVER BLOCK
    # ==========================================
    
    server {
        listen 80;
        listen [::]:80;
        server_name localhost bside.local *.bside.app;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # CORS headers (adjust for production)
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age "3600" always;
        
        # Preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
        
        # Connection limiting
        limit_conn addr 20;  # Max 20 connections per IP
        
        # ==========================================
        # HEALTH CHECKS
        # ==========================================
        
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location = /metrics {
            access_log off;
            stub_status;
            allow 10.0.0.0/8;  # Internal only
            deny all;
        }
        
        # ==========================================
        # CDN MEDIA PROXY (Cache S3/CloudFront)
        # ==========================================
        
        location /cdn/ {
            # Proxy to CloudFront/S3
            proxy_pass https://${CDN_BASE_URL}/;
            
            # Cache settings
            proxy_cache static_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            
            add_header X-Cache-Status $upstream_cache_status;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # ==========================================
        # AUTHENTICATION (Rate Limited)
        # ==========================================
        
        location /api/pb/auth {
            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://pocketbase_write/api/auth;  # Write to master
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # ==========================================
        # REAL-TIME SUBSCRIPTIONS (Sticky Sessions)
        # ==========================================
        
        location /api/pb/realtime {
            limit_req zone=realtime burst=20 nodelay;
            
            proxy_pass http://pocketbase_realtime/api/realtime;
            proxy_http_version 1.1;
            
            # Sticky session headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket / SSE support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Long-lived connection timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;  # 10 minutes
            proxy_read_timeout 600s;  # 10 minutes
            
            # Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;
        }
        
        # ==========================================
        # FILE UPLOADS (Direct to S3 via Pre-Signed URL)
        # ==========================================
        
        location /api/v1/media/upload-url {
            limit_req zone=upload burst=5 nodelay;
            
            # Generate pre-signed S3 URL (via Ktor)
            proxy_pass http://ktor_backend/media/upload-url;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # Legacy: Direct upload to PocketBase (fallback)
        location /api/pb/files {
            limit_req zone=upload burst=5 nodelay;
            
            client_max_body_size 50M;
            client_body_buffer_size 10M;
            
            proxy_pass http://pocketbase_write/api/files;  # Write to master
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 90s;
            proxy_send_timeout 600s;  # 10 minutes for large files
            proxy_read_timeout 600s;
            
            proxy_request_buffering off;  # Stream uploads
        }
        
        # ==========================================
        # READ OPERATIONS (Load Balanced)
        # ==========================================
        
        location ~ ^/api/pb/(collections|records|lists) {
            limit_req zone=api_read burst=100 nodelay;
            
            # Route reads to read pool
            proxy_pass http://pocketbase_read;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Cache GET requests
            proxy_cache api_cache;
            proxy_cache_valid 200 30s;  # Cache reads for 30s
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
        
        # ==========================================
        # WRITE OPERATIONS (Master Only)
        # ==========================================
        
        location ~ ^/api/pb/(create|update|delete) {
            limit_req zone=api_write burst=20 nodelay;
            
            # All writes go to master
            proxy_pass http://pocketbase_write;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # No caching for writes
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # ==========================================
        # HEAVY OPERATIONS (Async Queue)
        # ==========================================
        
        location /api/v1/match {
            limit_req zone=api_write burst=10 nodelay;
            
            # Queue matching jobs (don't block)
            proxy_pass http://ktor_backend/match;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # ==========================================
        # BACKEND API (Ktor)
        # ==========================================
        
        location /api/v1/ {
            limit_req zone=api_read burst=50 nodelay;
            
            proxy_pass http://ktor_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # ==========================================
        # POCKETBASE ADMIN UI
        # ==========================================
        
        location /_/ {
            # Admin UI (no rate limiting)
            proxy_pass http://pocketbase_write/_/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # IP whitelist for admin (production)
            # allow 10.0.0.0/8;
            # deny all;
        }
        
        # ==========================================
        # FALLBACK
        # ==========================================
        
        location / {
            proxy_pass http://ktor_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # ==========================================
    # HTTPS SERVER (Production)
    # ==========================================
    
    # Uncomment and configure for production
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name bside.app www.bside.app;
    #     
    #     ssl_certificate /etc/nginx/ssl/bside.app.crt;
    #     ssl_certificate_key /etc/nginx/ssl/bside.app.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     
    #     # Include all location blocks from above
    # }
    
    # HTTP to HTTPS redirect (Production)
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name bside.app www.bside.app;
    #     return 301 https://$server_name$request_uri;
    # }
}
