# Smart Load Balancing with Consistency Guarantees
# 
# Features:
# - Session affinity (sticky sessions)
# - Read-after-write routing
# - Write coordination
# - Health-based routing
# - Automatic failover

# Map to track recent writes per user
map $cookie_pb_auth $user_id {
    ~*"userId\":\"([^\"]+)\"" $1;
    default "";
}

# Track write endpoints
map $request_uri $is_write_request {
    ~*/(create|update|delete|upsert) "1";
    default "0";
}

upstream pocketbase_master {
    # Master instance (all writes)
    server pocketbase-master:8090 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

upstream pocketbase_replicas {
    # Read replicas (load balanced)
    least_conn;  # Route to least busy
    
    # Session affinity based on user ID (for read consistency)
    hash $user_id consistent;
    
    server pocketbase-1:8090 max_fails=3 fail_timeout=30s weight=1;
    server pocketbase-2:8090 max_fails=3 fail_timeout=30s weight=1;
    server pocketbase-3:8090 max_fails=3 fail_timeout=30s weight=1;
    
    keepalive 256;
}

upstream pocketbase_realtime {
    # SSE/WebSocket: Sticky sessions (critical for ordering)
    ip_hash;  # Client IP-based affinity
    
    server pocketbase-1:8090 max_fails=2 fail_timeout=20s;
    server pocketbase-2:8090 max_fails=2 fail_timeout=20s;
    server pocketbase-3:8090 max_fails=2 fail_timeout=20s;
    server pocketbase-master:8090 max_fails=2 fail_timeout=20s backup;
    
    keepalive 512;
}

server {
    listen 80;
    server_name localhost bside.local;
    
    # Track recent writes in cookie (for read-after-write)
    set $write_timestamp "";
    if ($cookie_last_write_time) {
        set $write_timestamp $cookie_last_write_time;
    }
    
    # Calculate if recent write (< 2 seconds ago)
    set $is_recent_write "0";
    if ($write_timestamp != "") {
        set $time_since_write $((msec / 1000) - $write_timestamp);
        if ($time_since_write < 2) {
            set $is_recent_write "1";
        }
    }
    
    # ==========================================
    # WRITE OPERATIONS (Always to Master)
    # ==========================================
    
    location ~ ^/api/pb/(collections|records)/[^/]+/(create|update|delete|upsert) {
        limit_req zone=api_write burst=20 nodelay;
        
        # All writes go to master
        proxy_pass http://pocketbase_master;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Set cookie to track write time (for read-after-write)
        add_header Set-Cookie "last_write_time=$msec; Path=/; Max-Age=5; HttpOnly";
        
        # No caching for writes
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # ==========================================
    # READ OPERATIONS (Smart Routing)
    # ==========================================
    
    location ~ ^/api/pb/(collections|records)/[^/]+/records {
        limit_req zone=api_read burst=100 nodelay;
        
        # Smart routing based on recency of writes
        set $backend "pocketbase_replicas";
        
        # If recent write (< 2s), read from master for consistency
        if ($is_recent_write = "1") {
            set $backend "pocketbase_master";
        }
        
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Cache reads (but respect freshness)
        proxy_cache api_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri$user_id";
        
        # Bypass cache if recent write
        proxy_cache_bypass $is_recent_write;
        
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Routed-To $backend;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
    
    # ==========================================
    # REAL-TIME SUBSCRIPTIONS (Sticky Sessions)
    # ==========================================
    
    location /api/pb/realtime {
        limit_req zone=realtime burst=20 nodelay;
        
        # Sticky sessions: Critical for message ordering
        proxy_pass http://pocketbase_realtime;
        proxy_http_version 1.1;
        
        # Sticky session headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Long-lived connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Disable buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        
        # Track which instance handled connection (for debugging)
        add_header X-SSE-Instance $upstream_addr always;
    }
    
    # ==========================================
    # IDEMPOTENCY-PROTECTED ENDPOINTS
    # ==========================================
    
    location /api/v1/swipe {
        limit_req zone=api_write burst=5 nodelay;
        
        # Require idempotency token
        if ($http_x_idempotency_token = "") {
            return 400 '{"error": "Idempotency token required"}';
        }
        
        # Route to backend (will check token)
        proxy_pass http://ktor_backend/swipe;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Idempotency-Token $http_x_idempotency_token;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # ==========================================
    # TRANSACTION COORDINATOR
    # ==========================================
    
    location /api/v1/transactions {
        limit_req zone=api_write burst=10 nodelay;
        
        # Multi-entity operations
        proxy_pass http://ktor_backend/transactions;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Longer timeout for coordinated operations
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ==========================================
    # HEALTH CHECKS & METRICS
    # ==========================================
    
    location = /health {
        access_log off;
        
        # Check all upstreams
        content_by_lua_block {
            local http = require "resty.http"
            local cjson = require "cjson"
            
            local health = {
                master = "unknown",
                replicas = {},
                overall = "healthy"
            }
            
            -- Check master
            local httpc = http.new()
            local res, err = httpc:request_uri("http://pocketbase-master:8090/api/health")
            health.master = (res and res.status == 200) and "healthy" or "unhealthy"
            
            -- Check replicas
            for i = 1, 3 do
                local res, err = httpc:request_uri("http://pocketbase-" .. i .. ":8090/api/health")
                health.replicas[i] = (res and res.status == 200) and "healthy" or "unhealthy"
            end
            
            -- Overall status
            if health.master == "unhealthy" then
                health.overall = "degraded"
            end
            
            ngx.header.content_type = "application/json"
            ngx.say(cjson.encode(health))
        }
    }
    
    location = /metrics {
        access_log off;
        stub_status;
        allow 10.0.0.0/8;
        deny all;
    }
    
    # ==========================================
    # CONSISTENCY MONITORING
    # ==========================================
    
    location = /consistency/lag {
        access_log off;
        
        content_by_lua_block {
            local http = require "resty.http"
            local cjson = require "cjson"
            
            -- Query replication lag from master
            local httpc = http.new()
            local res, err = httpc:request_uri("http://pocketbase-master:8090/api/metrics/replication-lag")
            
            if res and res.status == 200 then
                local data = cjson.decode(res.body)
                
                -- Alert if lag > 1 second
                if data.lag_ms > 1000 then
                    ngx.log(ngx.WARN, "High replication lag: " .. data.lag_ms .. "ms")
                end
                
                ngx.header.content_type = "application/json"
                ngx.say(res.body)
            else
                ngx.status = 500
                ngx.say('{"error": "Failed to check replication lag"}')
            end
        }
    }
}

# ==========================================
# LOAD BALANCER STATUS PAGE
# ==========================================

server {
    listen 8080;
    server_name localhost;
    
    location = /status {
        access_log off;
        
        content_by_lua_block {
            local cjson = require "cjson"
            
            local status = {
                timestamp = ngx.time(),
                upstreams = {
                    master = {},
                    replicas = {},
                    realtime = {}
                },
                routing = {
                    write_requests = ngx.var.write_requests or 0,
                    read_requests = ngx.var.read_requests or 0,
                    cache_hits = ngx.var.cache_hits or 0
                }
            }
            
            ngx.header.content_type = "application/json"
            ngx.say(cjson.encode(status))
        }
    }
}
