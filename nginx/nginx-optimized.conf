events {
    worker_connections 4096;  # Increased for high traffic
    use epoll;  # Linux-optimized event mechanism
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss
               application/x-font-ttf font/opentype image/svg+xml;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=swipe_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=message_limit:10m rate=30r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    
    # Caching zones
    proxy_cache_path /var/cache/nginx/profiles levels=1:2 keys_zone=profile_cache:10m max_size=100m inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=500m inactive=1d use_temp_path=off;
    
    # Logging with extended metrics
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time" '
                        'cache=$upstream_cache_status gz=$gzip_ratio '
                        'conn=$connection reqs=$connection_requests';
    
    access_log /var/log/nginx/access.log detailed buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Redis upstream for distributed locking & session management
    upstream redis {
        server redis:6379;
        keepalive 16;
    }

    # PocketBase - Read replicas with least_conn load balancing
    upstream pocketbase_read {
        least_conn;
        server pocketbase:8090 max_fails=3 fail_timeout=10s weight=10;
        # Add read replicas here in production:
        # server pocketbase-replica1:8090 max_fails=3 fail_timeout=10s weight=5;
        # server pocketbase-replica2:8090 max_fails=3 fail_timeout=10s weight=5;
        keepalive 64;
    }
    
    # PocketBase - Write primary (single instance to avoid write conflicts)
    upstream pocketbase_write {
        server pocketbase:8090 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }
    
    # Ktor Backend - Business logic, matching, jobs
    upstream ktor_backend {
        least_conn;
        server server:8080 max_fails=3 fail_timeout=10s;
        # Add more Ktor instances in production:
        # server server2:8080 max_fails=3 fail_timeout=10s;
        # server server3:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Map to determine read vs write operations
    map $request_method $pocketbase_upstream {
        default         pocketbase_read;
        POST            pocketbase_write;
        PUT             pocketbase_write;
        PATCH           pocketbase_write;
        DELETE          pocketbase_write;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost bside.local;
        
        # Connection limits
        limit_conn perip 50;
        limit_conn perserver 5000;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Cache-Status $upstream_cache_status always;
        
        # Health check endpoint
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Nginx status for monitoring
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker network
            deny all;
        }

        # ==========================================
        # PocketBase Auth Routes (WRITE)
        # ==========================================
        location ~ ^/api/pb/collections/.*/auth-with-password {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://pocketbase_write;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # No caching for auth
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # ==========================================
        # PocketBase Profile Routes (READ-OPTIMIZED)
        # ==========================================
        location ~ ^/api/pb/collections/s_profiles/records {
            limit_req zone=api_limit burst=30 nodelay;
            
            # Smart routing based on method
            set $target_upstream $pocketbase_upstream;
            proxy_pass http://$target_upstream;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Caching for GET requests only
            proxy_cache profile_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $cookie_nocache $arg_nocache $http_x_no_cache;
            proxy_no_cache $request_method != GET;
            
            # Add headers to indicate cache status
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Upstream-Server $upstream_addr;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # ==========================================
        # Swipe Endpoint (WRITE-HEAVY, Special Handling)
        # ==========================================
        location = /api/v1/swipe {
            limit_req zone=swipe_limit burst=5 nodelay;
            
            # Require idempotency token
            if ($http_x_idempotency_token = "") {
                return 400 '{"error":"X-Idempotency-Token header required"}';
            }
            
            proxy_pass http://ktor_backend/swipe;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Idempotency-Token $http_x_idempotency_token;
            proxy_set_header Connection "";
            
            # No caching, no buffering for immediate response
            proxy_buffering off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ==========================================
        # Messaging Endpoints (HIGH-FREQUENCY WRITES)
        # ==========================================
        location ~ ^/api/pb/collections/m_messages {
            limit_req zone=message_limit burst=20 nodelay;
            
            # Route to write primary for all message operations
            proxy_pass http://pocketbase_write;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # WebSocket support for real-time
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # No caching for messages
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ==========================================
        # Real-time Subscriptions (WebSocket)
        # ==========================================
        location ~ ^/api/pb/realtime {
            # Route to read replicas for subscriptions
            proxy_pass http://pocketbase_read;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket settings
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            proxy_buffering off;
        }

        # ==========================================
        # File Uploads (Media to PocketBase)
        # ==========================================
        location ~ ^/api/pb/api/files {
            limit_req zone=upload_limit burst=3 nodelay;
            
            client_max_body_size 50M;
            client_body_buffer_size 1M;
            
            # Route to write primary
            proxy_pass http://pocketbase_write;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ==========================================
        # Static File Downloads (CDN-Ready)
        # ==========================================
        location ~ ^/api/pb/files/.*/.*\.(jpg|jpeg|png|gif|webp|mp4|pdf)$ {
            # Cache static files aggressively
            proxy_cache static_cache;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 5m;
            proxy_cache_bypass $cookie_nocache $arg_nocache;
            
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=3600";
            
            proxy_pass http://pocketbase_read;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ==========================================
        # General PocketBase API (Smart Routing)
        # ==========================================
        location /api/pb/ {
            limit_req zone=api_limit burst=30 nodelay;
            
            # Smart routing based on HTTP method
            set $target_upstream $pocketbase_upstream;
            proxy_pass http://$target_upstream;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # PocketBase Admin UI
        location /_/ {
            proxy_pass http://pocketbase_write/_/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Ktor Backend API (Business Logic)
        # ==========================================
        location /api/v1/ {
            limit_req zone=api_limit burst=30 nodelay;
            
            proxy_pass http://ktor_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ==========================================
        # Fallback
        # ==========================================
        location / {
            proxy_pass http://ktor_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
