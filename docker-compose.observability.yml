# Complete Observability Stack with OpenTelemetry
# Docker Compose for Development, Staging, and Production
# 
# Services:
# - OpenTelemetry Collector (unified telemetry)
# - Prometheus (metrics storage)
# - Grafana (visualization)
# - Jaeger (distributed tracing)
# - Tempo (trace storage)
# - Loki (log aggregation)
# - Promtail (log shipping)
# - AlertManager (alerting)
#
# Usage:
#   docker-compose -f docker-compose.observability.yml --env-file .env.development up -d
#   docker-compose -f docker-compose.observability.yml --env-file .env.production up -d

version: '3.9'

x-common-labels: &common-labels
  environment: ${ENVIRONMENT:-development}
  cluster: ${CLUSTER_NAME:-bside-local}
  version: ${APP_VERSION:-1.0.0}

services:
  # ==========================================
  # OPENTELEMETRY COLLECTOR
  # Central hub for all telemetry data
  # ==========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: bside-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"     # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"     # OTLP HTTP
      - "8888:8888"                         # Metrics endpoint
      - "8889:8889"                         # Prometheus exporter
      - "13133:13133"                       # Health check
      - "55679:55679"                       # zPages
    
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - otel-data:/var/log/otel
    
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CLUSTER_NAME=${CLUSTER_NAME:-bside-local}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - JAEGER_ENDPOINT=jaeger:14250
      - TEMPO_ENDPOINT=tempo:4317
      - LOKI_ENDPOINT=http://loki:3100/loki/api/v1/push
      - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-info}
      - TRACE_SAMPLING_PERCENTAGE=${TRACE_SAMPLING_PERCENTAGE:-10}
    
    depends_on:
      - jaeger
      - tempo
      - loki
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:13133"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - observability
      - bside-network
    
    labels:
      <<: *common-labels
      component: telemetry

  # ==========================================
  # PROMETHEUS
  # Metrics storage and querying
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: bside-prometheus
    restart: unless-stopped
    
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    
    depends_on:
      - otel-collector
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - observability
      - bside-network
    
    labels:
      <<: *common-labels
      component: metrics

  # ==========================================
  # ALERTMANAGER
  # Alert routing and management
  # ==========================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: bside-alertmanager
    restart: unless-stopped
    
    ports:
      - "9093:9093"
    
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    
    networks:
      - observability
    
    labels:
      <<: *common-labels
      component: alerting

  # ==========================================
  # GRAFANA
  # Visualization and dashboards
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: bside-grafana
    restart: unless-stopped
    
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    
    environment:
      # Security
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-your-secret-key}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      
      # Server
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      
      # Auth
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      
      # Database
      - GF_DATABASE_TYPE=${GRAFANA_DB_TYPE:-sqlite3}
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      
      # Logging
      - GF_LOG_LEVEL=${GRAFANA_LOG_LEVEL:-info}
      - GF_LOG_MODE=console file
      
      # Explore
      - GF_EXPLORE_ENABLED=true
      
      # Unified Alerting
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      
      # Feature toggles
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,traceToMetrics,publicDashboards
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    
    depends_on:
      - prometheus
      - loki
      - tempo
      - jaeger
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - observability
      - bside-network
    
    labels:
      <<: *common-labels
      component: visualization

  # ==========================================
  # JAEGER
  # Distributed tracing UI
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: bside-jaeger
    restart: unless-stopped
    
    ports:
      - "16686:16686"   # UI
      - "14268:14268"   # Collector HTTP
      - "14250:14250"   # Collector gRPC
      - "6831:6831/udp" # Compact thrift (UDP)
      - "6832:6832/udp" # Binary thrift (UDP)
      - "5778:5778"     # Serve configs
      - "9411:9411"     # Zipkin compatible
    
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=${JAEGER_STORAGE_TYPE:-badger}
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    
    volumes:
      - jaeger-data:/badger
    
    networks:
      - observability
      - bside-network
    
    labels:
      <<: *common-labels
      component: tracing

  # ==========================================
  # TEMPO
  # Trace storage backend
  # ==========================================
  tempo:
    image: grafana/tempo:latest
    container_name: bside-tempo
    restart: unless-stopped
    
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317"        # OTLP gRPC
      - "4318"        # OTLP HTTP
      - "9095:9095"   # Tempo gRPC
      - "14268"       # Jaeger ingest
    
    command: ["-config.file=/etc/tempo.yaml"]
    
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    
    networks:
      - observability
    
    labels:
      <<: *common-labels
      component: tracing

  # ==========================================
  # LOKI
  # Log aggregation
  # ==========================================
  loki:
    image: grafana/loki:latest
    container_name: bside-loki
    restart: unless-stopped
    
    ports:
      - "${LOKI_PORT:-3100}:3100"
    
    command: -config.file=/etc/loki/loki-config.yaml
    
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    
    environment:
      - LOKI_LOG_LEVEL=${LOKI_LOG_LEVEL:-info}
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-720h}
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - observability
    
    labels:
      <<: *common-labels
      component: logs

  # ==========================================
  # PROMTAIL
  # Log shipping agent
  # ==========================================
  promtail:
    image: grafana/promtail:latest
    container_name: bside-promtail
    restart: unless-stopped
    
    command: -config.file=/etc/promtail/promtail-config.yaml
    
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/app/logs:ro
      - promtail-positions:/tmp
    
    environment:
      - LOKI_URL=http://loki:3100
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CLUSTER_NAME=${CLUSTER_NAME:-bside-local}
      - PROMTAIL_LOG_LEVEL=${PROMTAIL_LOG_LEVEL:-info}
    
    depends_on:
      - loki
    
    networks:
      - observability
      - bside-network
    
    labels:
      <<: *common-labels
      component: logs

  # ==========================================
  # EXPORTERS
  # ==========================================
  
  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: bside-redis-exporter
    restart: unless-stopped
    
    ports:
      - "9121:9121"
    
    environment:
      - REDIS_ADDR=${REDIS_ADDR:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    
    networks:
      - observability
      - bside-network
    
    labels:
      <<: *common-labels
      component: exporter

  # Node Exporter (System Metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: bside-node-exporter
    restart: unless-stopped
    
    ports:
      - "9100:9100"
    
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    
    networks:
      - observability
    
    labels:
      <<: *common-labels
      component: exporter

  # cAdvisor (Container Metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: bside-cadvisor
    restart: unless-stopped
    
    ports:
      - "8084:8080"
    
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    
    privileged: true
    
    devices:
      - /dev/kmsg
    
    networks:
      - observability
    
    labels:
      <<: *common-labels
      component: exporter

# ==========================================
# NETWORKS
# ==========================================
networks:
  observability:
    driver: bridge
    name: bside-observability
  
  bside-network:
    external: true
    name: bside-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  otel-data:
    driver: local
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
  tempo-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local
